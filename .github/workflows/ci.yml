name: CI

on:
  push:
    branches: [master, main, release]
  pull_request:
    branches: [master, main, release]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Smoke test — initialize
        run: |
          echo '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.0"}}}' | timeout 5 node server.mjs | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              const r=JSON.parse(d);
              if(r.result?.protocolVersion!=='2025-11-25') process.exit(1);
              console.log('initialize OK');
            })"

      - name: Smoke test — tools/list names
        run: |
          echo '{"jsonrpc":"2.0","method":"tools/list","id":2}' | timeout 5 node server.mjs | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              const r=JSON.parse(d);
              const names = (r.result?.tools || []).map(t => t.name);
              const expected = ['mcp.mcp','mcp.help','mcp.arango','mcp.tool.template','mcp.tool.database','mcp.tool.collection','mcp.tool.view','mcp.tool.graph','mcp.tool.admin','mcp.tool.atlas'];
              if(JSON.stringify(names)!==JSON.stringify(expected)) process.exit(1);
              console.log('tools/list OK:', r.result.tools.length, 'tools');
            })"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax (all .mjs files parse)
        run: |
          for f in server.mjs src/*.mjs src/transports/*.mjs src/lib/*.mjs; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

      - name: Check no npm dependencies needed
        run: |
          if [ -d node_modules ]; then
            echo "ERROR: node_modules should not exist"
            exit 1
          fi
          node --input-type=module <<'EOF'
            import './src/bus.mjs'
            import './src/errors.mjs'
            import './src/connection.mjs'
            import './src/env.mjs'
            import './src/log.mjs'
          EOF
          echo "No dependencies needed"
